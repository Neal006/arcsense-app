[project]
name = "arcsense-ml"
version = "0.1.0"
description = "ARC SENSE data readers, bilateral alignment, QA, and EdgeML training/export pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
train = [
    "scikit-learn>=1.5",
    "tensorflow>=2.17,<2.21",
]

[project.scripts]
arcsense-qa = "arcsense_ml.cli:qa_main"
arcsense-align = "arcsense_ml.cli:align_main"
arcsense-bin2csv = "arcsense_ml.cli:bin2csv_main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arcsense_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "train: requires the [train] extra (tensorflow, scikit-learn)",
]

[tool.coverage.run]
source = ["arcsense_ml"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["tensorflow.*", "sklearn.*"]
ignore_missing_imports = true
